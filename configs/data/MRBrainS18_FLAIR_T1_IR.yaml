##### Dataset Processing Code Implementation #####
# Save data in H5 format
# Store patient-specific data as datasets within each group in the H5 file (e.g., Groups: MR, CT, synCT)
# Each dataset should be in the shape [H, W, D] and normalized between -1 and 1
# And all the data be interpolated into same height, width
# Detailed modifications can be made through transform.py

## Core setting (Important)
_target_: src.data.SynthRAD_MR_CT_Pelvis_datamodule.SynthRAD_MR_CT_Pelvis_DataModule
name: MRBrainS18_FLAIR_T1_IR
type: nifti
data_dir: ${paths.root_dir}/data/MRBrainS18
data_group_1: "FLAIR"
data_group_2: "T1"
data_group_3: "T1"   # ref for 25D style (same source as group2, registered to FLAIR via apply_linear_registration)
data_group_4: null
data_group_5: null
data_group_6: null
data_group_7: null
is_3d: False # True: 3D processing, False: 2D processing
batch_size: 1
num_workers: 6 # 3
pin_memory: False
use_split_inference: False # Inference for valid and test is divided into half from the original image (for memory issue)
eval_on_align: False
use_sliding_inference: False
use_multiple_outputs: False
use_triple_outputs: False
use_misalign_simul: False
use_25d_style: True
ref_stack_size: 3
apply_linear_registration: True   # True: SimpleITK rigid registration 후 캐싱
apply_non_linear_registration: False  # True: ConvexAdam(MIND-SSC) non-linear registration 후 캐싱 (linear 결과를 moving으로 사용)
registration_targets: [2, 3]     # group_1(FLAIR) 기준, T1/IR 모두 등록 (정의 안된 group은 자동 스킵)

## Dataset File Name
# prepared_data_0_0_0_0_0_ver3_final.h5
# Ver3_AllPatientSameSize_final_2.h5
# Ver3_OnlyOnePatient.h5
# Registration_MR_CT_synCT.h5
train_file: 'trainset.h5'
val_file: 'valset.h5'
test_file: 'testset.h5' 

## Preprocessing
reverse: False # New
flip_prob: 0 #.5 #0.5
rot_prob: 0 #.5 #0.5
padding_size: null # Padding to hegith, width   [256, 256] -> [target_height, target_width] or null
crop_size: [128, 128] # Random crop to hegith, width  [128, 128] -> [target_height, target_width] or null
norm_ZeroToOne: False

## Intenional Misalignment
# misalign_x: 0
# misalign_y: 0
# degree: 0
# motion_prob: 0
# deform_prob: 0