# EXPERIMENT 2 — Tokenized SWA (patch-token cross-attention) + multi-scale guidance + AdaLN
#
# Builds on experiment 1. The guidance *producer* becomes Transformer-native:
#   before: pixel-level SWA, 1x1 conv Q/K on downsampled intensities
#   now   : patch tokens -> per-patch Linear Q/K -> slice-neighborhood cross-attention
#
# The MIGS principle is preserved: Q/K select the correspondence, but the value
# that is actually transported is the RAW moving patch intensity, so the guidance
# stays "the moving contrast at this fixed location" and cannot collapse into a
# re-encoding of the fixed anatomy.
#
# Guidance is still 1 channel here (directly comparable to the CGM); it is turned
# into a pyramid so each generator stage is conditioned at its own resolution.
#
#   run: python src/train.py model=proposed_synthesis_exp2_token_swa.yaml ...

defaults:
  - proposed_synthesis_pure_natten
  - _self_

name: MIGS_Exp2_TokenSWA

netG_A:
  guidance_mode: token_swa        # 'swa' | 'conv_ablation' | 'token_swa'
  pure_modulation: adaln_zero
  adaln_gate_zero_init: true

  token_swa_patch_size: 2         # 128 -> 64 token grid, matching pure_patch_size
  token_swa_token_dim: 96         # patch-token width for the guidance encoder
  token_swa_qk_dim: 32            # Q/K projection width
  token_swa_window: 3             # 3x3 moving-token neighbourhood per slice
                                  # -> K(3) x 9 = 27 candidates per fixed token
  token_swa_guidance_dim: 1       # 1 = raw-appearance guidance (experiment 2)
  token_swa_multiscale: true      # patch-merging pyramid G0/G1/G2 -> per-stage guidance
