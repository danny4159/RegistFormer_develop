_target_: src.models.swinunetr_synthesis_module.SwinUNETRSynthesisModule

name: SwinUNETR_sCT

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0001

scheduler: null

netG_A:
  _target_: monai.networks.nets.SwinUNETR
  img_size: [64, 96, 96]
  in_channels: 1
  out_channels: 1
  feature_size: 48
  use_checkpoint: true
  spatial_dims: 3

netD_A:
  _target_: src.models.components.networks_define.define_D
  input_nc: 1
  ndf: 32
  netD: basic3D
  norm: instance
  init_type: normal

params:
  lambda_mae: 1.0
  mask_threshold: -0.95
  use_masked_loss: true
  use_eval_ref: ${data.data_group_3}
  use_adversarial_loss: false
  lambda_adversarial: 0.01
  gan_type: lsgan
  use_perceptual_loss: false
  lambda_perceptual: 0.01
  perceptual_layers: [4, 9, 18]
  norm_ZeroToOne: ${data.norm_ZeroToOne}
  reverse: ${data.reverse}
  batch_size: ${data.batch_size}
  eval_on_align: ${data.eval_on_align}
  use_sliding_inference: true
  use_multiple_outputs: false
  use_misalign_simul: false
  use_25d_style: false
  ref_stack_size: 1
  is_3d: true
  crop_size: ${data.crop_size}
  is_registration: false
  patch_size: [96, 96, 64]
  patch_size_monai: [64, 96, 96]
  infer_overlap: 0.25
  sw_batch_size: 1
