_target_: src.models.proposed_synthesis_module.ProposedSynthesisModule

name: AttnDirect

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0001
  betas: [0.5, 0.999]
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.MultiStepLR
  _partial_: true
  milestones: [250000, 300000]
  gamma: 0.5

netG_A:
  _target_: src.models.components.networks_define.define_G
  netG_type: 'attn_direct'
  input_nc: 1
  output_nc: 1
  ngf: 64
  n_blocks: 4
  ref_stack_size: ${data.ref_stack_size}
  attn_mode: 'qk'             # 'qk' | 'qkv' | 'qk_ncc' | 'qkv_ncc'
  downsample: 2               # DS=2 (S3 attention at half resolution)
  window: 3
  dim: 32                     # Q/K proj dim (larger than default 16)
  use_spatial_value_fusion: true
  use_qk_norm: true
  init_temperature: 10.0
  fixed_temperature: false
  coarse: false
  slice_score_pool: 'logsumexp'
  spatial_tau: 0.5
  direct_alpha: 1.0
  use_confidence_gate: false   # disabled: we want pure attention weighting
  confidence_mode: 'entropy'
  confidence_min: 0.0
  qk_input_mode: 'image'
  selector_target_tau: 0.2
  selector_target_detach: true
  v_feat_dim: 32              # V projection dim (only used in qkv/qkv_ncc modes)
  use_feat_beta: true         # RefEncoder cosine similarity for beta (fixes uniform-beta)
  feat_beta_tau: 0.1          # temperature; lower = sharper spatial selection
  use_separate_src_encoder: false  # v6: separate SrcEncoder to avoid shared-encoder alignment
  use_pos_bias: false              # v6: learnable win² position bias for offset preference
  use_stride_encoder: false        # v7: stride conv on full-res input instead of bilinear pre-downsample
  use_multiscale_stride: false     # v7-ms: attend at DS=2 and DS=4, sum weighted feats
  use_stride_conditioner: false    # v7-sc: stride conv for conditioner Q/K input (slice selection)
  ref_encoder_type: stride         # v8: 'stride' (v7), '2d', '2d3d', '3d' (unified attention)
  use_25d_style: ${data.use_25d_style}  # unused by AttnDirect but kept for compat

netD_A:
  _target_: src.models.components.networks_define.define_D
  input_nc: 1
  ndf: 64
  norm: 'instance'
  n_layers_D: 3
  init_type: 'normal'

netD_B:
  _target_: src.models.components.networks_define.define_D
  input_nc: 1
  ndf: 64
  norm: 'instance'
  n_layers_D: 3
  init_type: 'normal'

netD_C:
  _target_: src.models.components.networks_define.define_D
  input_nc: 1
  ndf: 64
  norm: 'instance'
  n_layers_D: 3
  init_type: 'normal'

netF_A:
  _target_: src.models.components.networks_define.define_F
  netF_type: 'mlp_sample'
  use_mlp: true
  init_type: 'xavier'
  init_gain: 0.02
  nc: 256
  input_nc: 256    # ngf*4 = 64*4=256 (enc2 and bottleneck)

params:
  lambda_gan: 1
  lambda_style: 5
  lambda_nce: 1.5
  lambda_mind: 0
  lambda_l1: 0
  lambda_perceptual: 0

  # Attention regularization
  lambda_slice_entropy: 0.02
  lambda_slice_smoothness: 0.005
  slice_entropy_target_eff_k: 2.0
  lambda_slice_target: 0.0

  # S3 spatial beta regularization
  lambda_beta_entropy: 0.0
  lambda_beta_smoothness: 0.0
  beta_entropy_target_eff_k: 3.0

  reverse: ${data.reverse}
  use_split_inference: ${data.use_split_inference}
  flip_equivariance: false
  batch_size: ${data.batch_size}
  nce_layers: [2, 3]          # enc2(256ch) + bottleneck(256ch)
  eval_on_align: ${data.eval_on_align}
  use_sliding_inference: ${data.use_sliding_inference}
  use_multiple_outputs: ${data.use_multiple_outputs}
  use_triple_outputs: ${data.use_triple_outputs}
  nce_on_vgg: false
  nce_independent: false
  use_misalign_simul: ${data.use_misalign_simul}
  is_3d: ${data.is_3d}
  crop_size: ${data.crop_size}
  is_registration: false
  use_25d_style: ${data.use_25d_style}
  ref_stack_size: ${data.ref_stack_size}
  ctx_center_only: false
  ctx_agg_mode: 'softmin'
  ctx_softmin_tau: 0.3
  ctx_shift_penalty: 0.01
  log_ref_condition: true
  log_style_modulation: false   # AttnDirect has no StyleConv
  log_z_select_interval: 200
