_target_: src.models.proposed_synthesis_module.MIGSModule

name: MIGS

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0001
  betas: [0.5, 0.999]
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.MultiStepLR
  _partial_: true
  milestones: [250000, 300000]
  gamma: 0.5

netG_A:
  _target_: src.models.components.networks_define.define_G
  netG_type: 'proposed_synthesis'  # keep: selects MIGSGenerator (aliased as ProposedSynthesisModule) in the model factory
  input_nc: 1
  output_nc: 1
  feat_ch: 264 #256 # For triple_outputs, use 126 or 132 (multiple of 3)
  use_multiple_outputs: ${data.use_multiple_outputs}
  use_triple_outputs: ${data.use_triple_outputs}
  is_3d: ${data.is_3d}
  use_separate_style_layers: false
  noise_independent: false  # false: noise injected after concatenation (default), true: separate noise per chunk
  use_25d_style: ${data.use_25d_style}  # keep: connects to common DataModule / model factory
  ref_stack_size: ${data.ref_stack_size}  # keep: K, size of the moving stack y_adj^k
  guidance_mode: swa              # 'swa' (Slice-Window Attention, reported model) | 'conv_ablation' (plain-conv CGM baseline) | 'local_2d_legacy'
  swa_window_size: 3              # local window size (odd): 1 (slice-only) | 3 | 5
  swa_qk_channels: 16             # hidden dim for SWA Q/K/V projections (default 16)
  swa_center_slice_bias: 0.0      # center slice score bias; lower = attention learns more freely (e.g. 0.05)
  swa_use_raw_values: true        # true: attention weights directly mix raw moving-stack values (no V_proj/out_proj shortcut)
  cgm_blend_alpha: 1.0            # cgm = center_moving + alpha*(attended_moving - center_moving); 0=center only, 1=full attention
  swa_use_cosine_similarity: true # true: cosine similarity QK + learnable temperature (prevents Q,K→0 collapse)
  swa_use_uniform_attention: false  # true: bypass learned attn with 1/(K*win²) uniform weights (ablation baseline)
  swa_temperature_init: 10.0      # initial temperature for QK softmax (higher=sharper; 3.0=soft, 10.0=default, 30.0=sharp)
  swa_learnable_temperature: true # false: freeze QK temperature at init (prevent collapse toward uniform)
  swa_downsampling_factor: 8      # CGM downsample factor: 16 (1/16) | 8 | 4 | 2 | 1 (submitted model uses 8)
  # init_type: 'kaiming'

netD_A:
  _target_: src.models.components.networks_define.define_D
  input_nc: 1
  ndf: 64
  norm: 'instance'
  n_layers_D: 3
  init_type: 'normal' #'kaiming'

netD_B:
  _target_: src.models.components.networks_define.define_D
  input_nc: 1
  ndf: 64
  norm: 'instance'
  n_layers_D: 3
  init_type: 'normal' #'kaiming'

netD_C:
  _target_: src.models.components.networks_define.define_D
  input_nc: 1
  ndf: 64
  norm: 'instance'
  n_layers_D: 3
  init_type: 'normal' #'kaiming'

netF_A: # For PatchNCELoss
  _target_: src.models.components.networks_define.define_F
  netF_type: 'mlp_sample'
  use_mlp: True #True
  init_type: 'xavier' #'xavier'
  init_gain: 0.02
  nc: 256
  input_nc: 264 # ${model.netG_A.feat_ch} #TODO: input_nc must be 'feat_ch * output_nc'  for multiple/triple outputs



params: # Other params
  lambda_gan: 1
  lambda_cx: 5           # contextual (cx) loss weight against the moving stack
  # lambda_cycle_a: 1
  # lambda_cycle_b: 1
  # lambda_sc: 0.1
  lambda_nce: 1.5
  lambda_mind: 0
  lambda_l1: 0
  lambda_perceptual: 0     # VGG feature L2 perceptual loss (same 2.5D softmin form as contextual)
  lambda_swa_entropy: 0    # >0: penalize SWA attention entropy (encourage selective/peaked slice-window attention)
  flip_equivariance: False
  batch_size: ${data.batch_size}
  nce_layers: [0,2,4,6] # [0,2,4,6] # up to index 3 is the encoder # [0,1,2,3] -> encoder-only performs worse; using all layers works better.
  eval_on_align: ${data.eval_on_align}
  use_sliding_inference: ${data.use_sliding_inference}
  use_multiple_outputs: ${data.use_multiple_outputs} # Set True if data_group_3 is exist (2 outputs)
  use_triple_outputs: ${data.use_triple_outputs} # Set True if data_group_4 is exist (3 outputs: T1, PD, MRA)
  nce_on_vgg: false #True
  nce_independent: false
  use_misalign_simul: ${data.use_misalign_simul}
  is_3d: ${data.is_3d}
  crop_size: ${data.crop_size} # [128,128] or [128,128,16]
  is_registration: false
  use_25d_style: ${data.use_25d_style}
  ref_stack_size: ${data.ref_stack_size}
  cx_center_only: false     # true: compute cx loss using only the center slice, even in 2.5D (2D equivalent)
  cx_stack_aggregation: 'mean'  # 'softmin': center-biased soft-min (default) | 'mean': simple mean over all slices (reported MIGS)
  cx_softmin_temperature: 0.3   # soft-min temperature (smaller = closer to hard-min) — softmin only
  cx_slice_offset_penalty: 0.05 # center slice preference bias per neighbor step — softmin only
  log_swa_stats: true       # true: log swa/* (Slice-Window Attention) statistics
  log_mig_conv_stats: true  # true: log mig_conv/* (CGM gamma/beta modulation) statistics
  diagnostic_log_interval: 100  # logging interval (steps) for swa/mig_conv diagnostics
